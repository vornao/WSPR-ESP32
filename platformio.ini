; WSPR beacon for ESP32-C3 + Si5351.
; Generic ESP32-C3 board definition: works for DevKitM-1, "Super Mini" and most clones.
;
;   pio run -t upload                 build and flash over USB
;   pio run -e esp32c3-ota -t upload  flash over WiFi (needs OTA_PASSWORD, see below)
;   pio test -e native                unit tests for lib/wspr, on this computer

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
upload_speed = 921600

; Route Serial to the chip's native USB (needed for boards without a USB-UART bridge,
; e.g. the C3 Super Mini). Harmless on boards that have one.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    etherkit/Etherkit Si5351 @ ^2.2.0
    etherkit/Etherkit JTEncode @ ^1.3.1

; Firmware update over WiFi. The board must be running and on the same network, and
; OTA_PASSWORD must be set in include/secrets.h (OTA is off without it). The uploader
; needs the same password: put it in platformio_override.ini (gitignored), see
; platformio_override.ini.example. Do not put it here; this file is tracked by git.
[env:esp32c3-ota]
extends = env:esp32c3
upload_protocol = espota
upload_port = wspr.local

; Host unit tests for the portable part of lib/wspr (protocol and scheduling).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra
